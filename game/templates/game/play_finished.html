{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ route.name }} — {% trans "Finished!" %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; color: #f0f6fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="text-center px-3" style="max-width:480px">
    <div style="font-size:4rem">{{ route.display_completion_emoji }}</div>
    <h1 class="h3 mt-3">{% trans "You finished!" %}</h1>
    {% if route.completion_message %}
    <p class="mt-3" style="white-space:pre-wrap">{{ route.completion_message }}</p>
    {% endif %}
    <p class="text-muted mt-2">{{ route.name }}</p>
  </div>
</body>
</html>
