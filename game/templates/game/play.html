{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ route.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0d1117; color:#f0f6fc; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .distance-display { font-size:5rem; font-weight:700; line-height:1; }
    .unit { font-size:1.5rem; color:#8b949e; }
    .progress-label { color:#8b949e; font-size:0.9rem; }
    #status-msg { min-height:1.5rem; color:#8b949e; font-size:0.85rem; }
    #proximity-bar { transition: width 0.5s; }
    #waypoint-panel.busy { opacity:.5; pointer-events:none; }
  </style>
</head>
<body>
  <div class="text-center px-3" style="max-width:420px;width:100%">
    <h1 class="h5 mb-1">{{ route.name }}</h1>
    <div id="waypoint-panel">
      {% include "game/_play_waypoint.html" %}
    </div>
  </div>

  <script>
    // Mutable: these are re-pointed at the next waypoint after each advance,
    // which happens in place so the geolocation watch is never torn down.
    let TARGET_LAT = {{ current.lat }};
    let TARGET_LNG = {{ current.lng }};
    let ADVANCE_TYPE = "{{ current.advance_type }}";
    let PROXIMITY_M = {{ current.proximity_meters }};

    const ANSWER_ERROR = {{ answer_error|yesno:"true,false" }};
    const ADVANCE_URL = "{% url 'play_advance' token %}";
    const PLAY_URL = "{% url 'play_game' token %}";
    const CSRF = "{{ csrf_token }}";
    const panel = document.getElementById("waypoint-panel");

    let advanced = false;
    let arrived = ANSWER_ERROR;  // already arrived if re-showing after a wrong answer
    let advancing = false;

    // i18n strings for JS
    {% trans "Accuracy: ±{accuracy} m" as str_accuracy %}
    {% trans "Could not detect your location. Make sure location access is enabled in your browser and device settings." as str_loc_failed %}
    {% trans "Location access denied. Enable it in your browser settings and reload." as str_loc_denied %}
    {% trans "Geolocation is not supported by this browser." as str_no_geo %}
    {% trans "Close enough — advancing…" as str_close_enough %}
    {% trans "Get within {meters} m to continue ({distance} m away)" as str_get_within_away %}
    {% trans "Get within {meters} m to continue" as str_get_within %}
    {% trans "Improving accuracy…" as str_improving %}
    const I18N = {
      accuracy:      "{{ str_accuracy|escapejs }}",
      locationFailed:"{{ str_loc_failed|escapejs }}",
      locationDenied:"{{ str_loc_denied|escapejs }}",
      noGeo:         "{{ str_no_geo|escapejs }}",
      closeEnough:   "{{ str_close_enough|escapejs }}",
      getWithinAway: "{{ str_get_within_away|escapejs }}",
      getWithin:     "{{ str_get_within|escapejs }}",
      improving:     "{{ str_improving|escapejs }}",
    };

    if (arrived) revealAdvanceUI();

    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function setStatus(msg, isError) {
      const el = document.getElementById("status-msg");
      if (!el) return;
      el.textContent = msg;
      el.style.color = isError ? "#f85149" : "#8b949e";
    }

    function revealAdvanceUI() {
      const el = document.getElementById("advance-ui");
      if (el) el.style.display = "block";
    }

    // --- Advancing without a page reload -----------------------------------
    // The server stays authoritative for progress; it answers with a rendered
    // fragment for the next waypoint, which we swap into the panel.
    async function advance(formData) {
      if (advancing) return;
      advancing = true;
      panel.classList.add("busy");
      try {
        const res = await fetch(ADVANCE_URL, {
          method: "POST",
          headers: {"X-Requested-With": "XMLHttpRequest", "X-CSRFToken": CSRF},
          body: formData,
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (data.status === "finished") {
          window.location.href = PLAY_URL;  // one reload, only at the very end
          return;
        }

        panel.innerHTML = data.html;

        if (data.status === "advanced") {
          TARGET_LAT = data.waypoint.lat;
          TARGET_LNG = data.waypoint.lng;
          ADVANCE_TYPE = data.waypoint.advance_type;
          PROXIMITY_M = data.waypoint.proximity_meters;
          arrived = false;
          advanced = false;
        } else {
          // Wrong answer: still standing at the same waypoint.
          arrived = true;
          revealAdvanceUI();
        }
      } catch (err) {
        // Never leave the player stuck — fall back to a normal page load.
        window.location.href = PLAY_URL;
      } finally {
        advancing = false;
        panel.classList.remove("busy");
      }
    }

    // Delegated: the forms are replaced on every advance.
    panel.addEventListener("submit", (e) => {
      e.preventDefault();
      advance(new FormData(e.target));
    });

    const ACCURACY_THRESHOLD_M = 50;

    function update(pos) {
      const acc = Math.round(pos.coords.accuracy);
      if (pos.coords.accuracy > ACCURACY_THRESHOLD_M) {
        setStatus(I18N.improving + " (±" + acc + " m)", false);
        return;
      }
      const d = haversineMeters(pos.coords.latitude, pos.coords.longitude, TARGET_LAT, TARGET_LNG);
      const distEl = document.getElementById("distance");
      if (distEl) distEl.textContent = Math.round(d);
      setStatus(I18N.accuracy.replace("{accuracy}", acc), false);

      if (ADVANCE_TYPE === "proximity") {
        revealAdvanceUI();
        const pct = Math.max(0, Math.min(100, (1 - d / (PROXIMITY_M * 5)) * 100));
        const bar = document.getElementById("proximity-bar");
        if (bar) bar.style.width = pct + "%";
        const label = document.getElementById("proximity-label");
        if (!label) return;
        if (d <= PROXIMITY_M) {
          label.textContent = I18N.closeEnough;
          if (!advanced) {
            advanced = true;
            const form = document.getElementById("auto-advance-form");
            if (form) advance(new FormData(form));
          }
        } else {
          label.textContent = I18N.getWithinAway
            .replace("{meters}", PROXIMITY_M)
            .replace("{distance}", Math.round(d));
        }
      } else {
        if (!arrived && d <= PROXIMITY_M) {
          arrived = true;
          revealAdvanceUI();
        }
      }
    }

    if (navigator.geolocation) {
      let gotPosition = false;
      const timeoutId = setTimeout(() => {
        if (!gotPosition) setStatus(I18N.locationFailed, true);
      }, 8000);

      navigator.geolocation.watchPosition(
        (pos) => { gotPosition = true; clearTimeout(timeoutId); update(pos); },
        (err) => {
          clearTimeout(timeoutId);
          setStatus(err.code === 1 ? I18N.locationDenied : I18N.locationFailed, true);
        },
        {enableHighAccuracy: true, maximumAge: 0}
      );
    } else {
      setStatus(I18N.noGeo, true);
    }
  </script>
</body>
</html>
