{% extends "game/base.html" %}
{% load i18n %}
{% block title %}{% trans "New Route" %} — Pinpoint{% endblock %}

{% block content %}
<h1 class="h3 mb-4">{% trans "New Route" %}</h1>
<form method="post" class="row g-3" style="max-width:500px">
  {% csrf_token %}
  <div class="col-12">
    <label class="form-label">{% trans "Name" %}</label>
    <input name="name" type="text" class="form-control" required autofocus>
  </div>
  <div class="col-12">
    <label class="form-label">{% trans "Description" %} <span class="text-muted">({% trans "optional" %})</span></label>
    <textarea name="description" class="form-control" rows="2"></textarea>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">{% trans "Create &amp; add waypoints" %}</button>
    <a href="{% url 'route_list' %}" class="btn btn-link">{% trans "Cancel" %}</a>
  </div>
</form>
{% endblock %}
