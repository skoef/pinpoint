{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pinpoint</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0d1117; color:#f0f6fc; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:2rem; width:100%; max-width:360px; }
    .form-control { background:#0d1117; border-color:#30363d; color:#f0f6fc; }
    .form-control:focus { background:#0d1117; border-color:#0d6efd; color:#f0f6fc; box-shadow:none; }
    label { color:#8b949e; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1 class="h4 mb-4 text-center">Pinpoint</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
      <div class="alert alert-danger py-2 small">{% trans "Invalid username or password." %}</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label">{% trans "Username" %}</label>
        <input type="text" name="username" class="form-control" autofocus autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label">{% trans "Password" %}</label>
        <input type="password" name="password" class="form-control" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100">{% trans "Log in" %}</button>
    </form>
  </div>
</body>
</html>
